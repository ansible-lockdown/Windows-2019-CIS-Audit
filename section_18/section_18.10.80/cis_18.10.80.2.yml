---

{{ if .Vars.win19cis_level_1 }}
  {{ if .Vars.win19cis_rule_18_10_80_2 }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\WindowsInkWorkspace\AllowWindowsInkWorkspace:
    title: "18.10.80.2 | Ensure 'Allow Windows Ink Workspace' is set to 'Enabled: On, but disallow access above lock' OR 'Enabled: Disabled' | AllowWindowsInkWorkspace"
    exists: true
    value: {{ .Vars.win19cis_allow_windows_ink_workspace }}
    type: REG_DWORD
    meta:
      domaincontroller: 1
      memberserver: 1
      server: 1
      CIS_ID:
        - 18.10.80.2
      NIST800-53R5:
        - SI-4
  {{ end }}
{{ end }}
