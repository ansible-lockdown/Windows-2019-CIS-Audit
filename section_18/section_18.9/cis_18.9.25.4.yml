---

{{ if and (ne .Vars.win19cis_system_role "domaincontroller") .Vars.win19cis_level_1 }}
  {{ if .Vars.win19cis_rule_18_9_25_4 }}
    {{ if eq .Vars.win19cis_system_role "memberserver" }}
registry:
  HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS\PasswordComplexity:
    title: "18.9.25.4 | Ensure 'Password Settings: Password Complexity' is set to 'Enabled: Large letters + small letters + numbers + special characters' | PasswordComplexity"
    exists: true
    value: 4
    type: REG_DWORD
    meta:
      memberserver: 1
      server: 1
      CIS_ID:
        - 18.9.25.4
      NIST800-53R5:
        - IA-5(1)
    {{ end }}
  {{ end }}
{{ end }}
