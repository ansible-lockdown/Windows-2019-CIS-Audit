---

{{ if .Vars.win19cis_level_2 }}
  {{ if .Vars.win19cis_rule_18_9_20_1_2 }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\Windows\Tabletpc\PreventHandwritingDataSharing:
    title: "18.9.20.1.2 | Ensure 'Turn off handwriting personalization data sharing' is set to 'Enabled' | PreventHandwritingDataSharing"
    exists: true
    value: 1
    type: REG_DWORD
    meta:
      domaincontroller: 2
      memberserver: 2
      server: 2
      CIS_ID:
        - 18.9.20.1.2
      NIST800-53R5:
        - SI-4
  {{ end }}
{{ end }}
