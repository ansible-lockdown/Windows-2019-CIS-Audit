---

{{ if .Vars.win19cis_level_1 }}
  {{ if .Vars.win19cis_rule_18_9_20_1_5 }}
registry:
  HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer\NoWebServices:
    title: "18.9.20.1.5 | Ensure 'Turn off Internet download for Web publishing and online ordering wizards' is set to 'Enabled' | NoWebServices"
    exists: true
    value: 1
    type: REG_DWORD
    meta:
      domaincontroller: 1
      memberserver: 1
      server: 1
      CIS_ID:
        - 18.9.20.1.5
      NIST800-53R5:
        - CM-6
        - CM-7
  {{ end }}
{{ end }}
