---

{{ if and (eq .Vars.win19cis_system_role "domaincontroller") .Vars.win19cis_ngws }}
  {{ if .Vars.win19cis_rule_18_9_5_6 }}
    {{ if eq .Vars.win19cis_system_role "domaincontroller" }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\Windows\DeviceGuard\LsaCfgFlags:
    title: "18.9.5.6 | (NG) Ensure 'Turn On Virtualization Based Security: Credential Guard Configuration' is set to 'Disabled' (DC Only) | LsaCfgFlags"
    exists: true
    value: 0
    type: REG_DWORD
    meta:
      domaincontroller: 1
      server: 1
      CIS_ID:
        - 18.9.5.6
      NIST800-53R5:
        - SI-16
    {{ end }}
  {{ end }}
{{ end }}
