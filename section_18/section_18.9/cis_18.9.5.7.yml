---

{{ if .Vars.win19cis_ngws }}
  {{ if .Vars.win19cis_rule_18_9_5_7 }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\Windows\DeviceGuard\ConfigureSystemGuardLaunch:
    title: "18.9.5.7 | (NG) Ensure 'Turn On Virtualization Based Security: Secure Launch Configuration' is set to 'Enabled' | ConfigureSystemGuardLaunch"
    exists: true
    value: 1
    type: REG_DWORD
    meta:
      domaincontroller: 1
      memberserver: 1
      server: 1
      CIS_ID:
        - 18.9.5.7
      NIST800-53R5:
        - SI-16
  {{ end }}
{{ end }}
