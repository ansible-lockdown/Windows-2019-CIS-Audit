---

{{ if .Vars.win19cis_level_1 }}
  {{ if .Vars.win19cis_rule_18_9_7_2 }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\Windows\Device Metadata\PreventDeviceMetadataFromNetwork:
    title: "18.9.7.2 | Ensure 'Prevent automatic download of applications associated with device metadata' is set to 'Enabled' | PreventDeviceMetadataFromNetwork"
    exists: true
    value: 1
    type: REG_DWORD
    meta:
      domaincontroller: 1
      memberserver: 1
      server: 1
      CIS_ID:
        - 18.9.7.2
  {{ end }}
{{ end }}
