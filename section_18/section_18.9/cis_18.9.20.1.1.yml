---

{{ if .Vars.win19cis_level_1 }}
  {{ if .Vars.win19cis_rule_18_9_20_1_1 }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Printers\DisableWebPnPDownload:
    title: "18.9.20.1.1 | Ensure 'Turn off downloading of print drivers over HTTP' is set to 'Enabled' | DisableWebPnPDownload"
    exists: true
    value: 1
    type: REG_DWORD
    meta:
      domaincontroller: 1
      memberserver: 1
      server: 1
      CIS_ID:
        - 18.9.20.1.1
      NIST800-53R5:
        - CM-7(5)
        - CM-10
  {{ end }}
{{ end }}
