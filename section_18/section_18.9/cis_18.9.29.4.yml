---

{{ if and (ne .Vars.win19cis_system_role "domaincontroller") .Vars.win19cis_level_1 }}
  {{ if .Vars.win19cis_rule_18_9_29_4 }}
    {{ if eq .Vars.win19cis_system_role "memberserver" }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\Windows\System\EnumerateLocalUsers:
    title: "18.9.29.4 | Ensure 'Enumerate local users on domain-joined computers' is set to 'Disabled' (MS only) | EnumerateLocalUsers"
    exists: true
    value: 0
    type: REG_DWORD
    meta:
      memberserver: 1
      server: 1
      CIS_ID:
        - 18.9.29.4
      NIST800-53R5:
        - AC-6(10)
    {{ end }}
  {{ end }}
{{ end }}
