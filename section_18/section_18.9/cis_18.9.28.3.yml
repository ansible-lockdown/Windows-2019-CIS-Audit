---

{{ if .Vars.win19cis_level_1 }}
  {{ if .Vars.win19cis_rule_18_9_28_3 }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\Windows\System\DontEnumerateConnectedUsers:
    title: "18.9.28.3 | Ensure 'Do not enumerate connected users on domain-joined computers' is set to 'Enabled' | DontEnumerateConnectedUsers"
    exists: true
    value: 1
    type: REG_DWORD
    meta:
      domaincontroller: 1
      memberserver: 1
      server: 1
      CIS_ID:
        - 18.9.28.3
      NIST800-53R5:
        - AC-6(10)
  {{ end }}
{{ end }}
