---

{{ if .Vars.win19cis_level_1 }}
  {{ if .Vars.win19cis_rule_18_9_13_1 }}
registry:
  HKLM\SYSTEM\CurrentControlSet\Policies\Earlylaunch\DriverLoadPolicy:
    title: "18.9.13.1 | Ensure 'Boot-Start Driver Initialization Policy' is set to 'Enabled: Good, unknown and bad but critical' | DriverLoadPolicy"
    exists: true
    value: 3
    type: REG_DWORD
    meta:
      domaincontroller: 1
      memberserver: 1
      server: 1
      CIS_ID:
        - 18.9.13.1
      NIST800-53R5:
        - SI-16
  {{ end }}
{{ end }}
