---

{{ if .Vars.win19cis_level_1 }}
  {{ if .Vars.win19cis_rule_18_9_28_5 }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\Windows\System\DisableLockScreenAppNotifications:
    title: "18.9.28.5 | Ensure 'Turn off app notifications on the lock screen' is set to 'Enabled' | DisableLockScreenAppNotifications"
    exists: true
    value: 1
    type: REG_DWORD
    meta:
      domaincontroller: 1
      memberserver: 1
      server: 1
      CIS_ID:
        - 18.9.28.5
      NIST800-53R5:
        - CM-6
        - CM-7
  {{ end }}
{{ end }}
