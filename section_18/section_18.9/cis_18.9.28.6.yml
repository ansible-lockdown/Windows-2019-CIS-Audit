    value: 1
    type: REG_DWORD
    meta:
      domaincontroller: 1
      memberserver: 1
      server: 1
      CIS_ID:
        - 18.9.28.6
      NIST800-53R5:
        - CM-6
        - CM-7
  {{ end }}
{{ end }}
