  {{ if .Vars.win19cis_rule_18_9_20_1_4 }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\Windows\Internet Connection Wizard\ExitOnMSICW:
    title: "18.9.20.1.4 | Ensure 'Turn off Internet Connection Wizard if URL connection is referring to Microsoft.com' is set to 'Enabled' | ExitOnMSICW"
    exists: true
    value: 1
    type: REG_DWORD
    meta:
      domaincontroller: 2
      memberserver: 2
      server: 2
      CIS_ID:
        - 18.9.20.1.4
      NIST800-53R5:
        - CM-6
        - CM-7
  {{ end }}
{{ end }}
