---

{{ if .Vars.win19cis_ngws }}
  {{ if .Vars.win19cis_rule_18_9_5_2 }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\Windows\DeviceGuard\RequirePlatformSecurityFeatures:
    title: "18.9.5.2 | (NG) Ensure 'Turn On Virtualization Based Security: Select Platform Security Level' is set to 'Secure Boot' or higher | RequirePlatformSecurityFeatures"
    exists: true
    value: {{ .Vars.win19cis_virtualization_based_security_level }}
    type: REG_DWORD
    meta:
      domaincontroller: 1
      memberserver: 1
      server: 1
      CIS_ID:
        - 18.9.5.2
      NIST800-53R5:
        - SI-16
  {{ end }}
{{ end }}
