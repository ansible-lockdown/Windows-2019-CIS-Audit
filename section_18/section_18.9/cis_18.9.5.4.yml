---

{{ if .Vars.win19cis_ngws }}
  {{ if .Vars.win19cis_rule_18_9_5_4 }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\Windows\DeviceGuard\HVCIMATRequired:
    title: "18.9.5.4 | (NG) Ensure 'Turn On Virtualization Based Security: Require UEFI Memory Attributes Table' is set to 'True (checked)' | HVCIMATRequired"
    exists: true
    value: 1
    type: REG_DWORD
    meta:
      domaincontroller: 1
      memberserver: 1
      server: 1
      CIS_ID:
        - 18.9.5.4
      NIST800-53R5:
        - SI-16
  {{ end }}
{{ end }}
