    value: 1
    type: REG_DWORD
    meta:
      domaincontroller: 1
      memberserver: 1
      server: 1
      CIS_ID:
        - 18.10.57.3.9.2
      NIST800-53R5:
        - SC-7(8)
  {{ end }}
{{ end }}
