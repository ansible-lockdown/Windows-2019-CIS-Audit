---

{{ if .Vars.win19cis_level_2 }}
  {{ if .Vars.win19cis_rule_18_10_57_3_10_1 }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services\MaxIdleTime:
    title: "18.10.57.3.10.1 | Ensure 'Set time limit for active but idle Remote Desktop Services sessions' is set to 'Enabled: 15 minutes or less, but not Never (0)' | MaxIdleTime"
    exists: true
    value: {{ .Vars.win19cis_idle_rdp_session_disconnect_time }}
    type: REG_DWORD
    meta:
      domaincontroller: 2
      memberserver: 2
      server: 2
      CIS_ID:
        - 18.10.57.3.10.1
      NIST800-53R5:
        - AC-11
  {{ end }}
{{ end }}
