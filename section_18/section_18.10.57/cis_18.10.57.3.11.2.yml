---

{{ if .Vars.win19cis_level_1 }}
  {{ if .Vars.win19cis_rule_18_10_57_3_11_2 }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services\PerSessionTempDir:
    title: "18.10.57.3.11.2 | Ensure 'Do not use temporary folders per session' is set to 'Disabled' | PerSessionTempDir"
    exists: true
    value: 1
    type: REG_DWORD
    meta:
      domaincontroller: 1
      memberserver: 1
      server: 1
      CIS_ID:
        - 18.10.57.3.11.2
      NIST800-53R5:
        - AU-11
        - SI-12
  {{ end }}
{{ end }}
