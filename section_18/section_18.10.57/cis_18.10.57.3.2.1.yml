  HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services\fSingleSessionPerUser:
    title: "18.10.57.3.2.1 | Ensure 'Restrict Remote Desktop Services users to a single Remote Desktop Services session' is set to 'Enabled' | fSingleSessionPerUser"
    exists: true
    value: 1
    type: REG_DWORD
    meta:
      domaincontroller: 2
      memberserver: 2
      server: 2
      CIS_ID:
        - 18.10.57.3.2.1
      NIST800-53R5:
        - CM-6
        - CM-7
  {{ end }}
{{ end }}
