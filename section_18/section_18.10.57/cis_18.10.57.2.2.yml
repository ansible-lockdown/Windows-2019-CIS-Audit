---

{{ if .Vars.win19cis_level_1 }}
  {{ if .Vars.win19cis_rule_18_10_57_2_2 }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services\DisablePasswordSaving:
    title: "18.10.57.2.2 | Ensure 'Do not allow passwords to be saved' is set to 'Enabled' | DisablePasswordSaving"
    exists: true
    value: 1
    type: REG_DWORD
    meta:
      domaincontroller: 1
      memberserver: 1
      server: 1
      CIS_ID:
        - 18.10.57.2.2
      NIST800-53R5:
        - CM-6
        - CM-7
  {{ end }}
{{ end }}
