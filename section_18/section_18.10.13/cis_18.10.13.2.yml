---

{{ if .Vars.win19cis_level_1 }}
  {{ if .Vars.win19cis_rule_18_10_13_2 }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\Windows\CloudContent\DisableWindowsConsumerFeatures:
    title: "18.10.13.2 | Ensure 'Turn off Microsoft consumer experiences' is set to 'Enabled' | DisableWindowsConsumerFeatures"
    exists: true
    value: 1
    type: REG_DWORD
    meta:
      domaincontroller: 1
      memberserver: 1
      server: 1
      CIS_ID:
        - 18.10.13.2
      NIST800-53R5:
        - CM-6
        - CM-7
  {{ end }}
{{ end }}
