    title: "18.10.82.2 | Ensure 'Always install with elevated privileges' is set to 'Disabled' | AlwaysInstallElevated"
    exists: true
    value: 0
    type: REG_DWORD
    meta:
      domaincontroller: 1
      memberserver: 1
      server: 1
      CIS_ID:
        - 18.10.82.2
      NIST800-53R5:
        - AC-2(9)
  {{ end }}
{{ end }}
