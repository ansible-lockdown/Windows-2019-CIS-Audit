---

{{ if .Vars.win19cis_level_1 }}
  {{ if .Vars.win19cis_rule_18_10_51_1 }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\Windows\Onedrive\DisableFileSyncNGSC:
    title: "18.10.51.1 | Ensure 'Prevent the usage of OneDrive for file storage' is set to 'Enabled' | DisableFileSyncNGSC"
    exists: true
    value: 1
    type: REG_DWORD
    meta:
      domaincontroller: 1
      memberserver: 1
      server: 1
      CIS_ID:
        - 18.10.51.1
      NIST800-53R5:
        - CM-6
        - CM-7
  {{ end }}
{{ end }}
