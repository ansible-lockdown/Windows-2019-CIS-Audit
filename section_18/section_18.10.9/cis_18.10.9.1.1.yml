---

{{ if .Vars.win19cis_level_1 }}
  {{ if .Vars.win19cis_rule_18_10_9_1_1 }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\Biometrics\Facialfeatures\EnhancedAntiSpoofing:
    title: "18.10.9.1.1 | Ensure 'Configure enhanced anti-spoofing' is set to 'Enabled' | EnhancedAntiSpoofing"
    exists: true
    value: 1
    type: REG_DWORD
    meta:
      domaincontroller: 1
      memberserver: 1
      server: 1
      CIS_ID:
        - 18.10.9.1.1
      NIST800-53R5:
        - CM-6b
  {{ end }}
{{ end }}
