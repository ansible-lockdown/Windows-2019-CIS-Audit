---

{{ if .Vars.win19cis_level_1 }}
  {{ if .Vars.win19cis_rule_18_10_8_2 }}
registry:
  HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer\NoAutorun:
    title: "18.10.8.2 | Ensure 'Set the default behavior for AutoRun' is set to 'Enabled: Do not execute any autorun commands' | NoAutorun"
    exists: true
    value: 1
    type: REG_DWORD
    meta:
      domaincontroller: 1
      memberserver: 1
      server: 1
      CIS_ID:
        - 18.10.8.2
      NIST800-53R5:
        - MP-7
  {{ end }}
{{ end }}
