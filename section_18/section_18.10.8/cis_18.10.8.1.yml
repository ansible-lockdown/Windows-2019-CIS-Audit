---

{{ if .Vars.win19cis_level_1 }}
  {{ if .Vars.win19cis_rule_18_10_8_1 }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\Windows\Explorer\NoAutoplayfornonVolume:
    title: "18.10.8.1 | Ensure 'Disallow Autoplay for non-volume devices' is set to 'Enabled' | NoAutoplayfornonVolume"
    exists: true
    value: 1
    type: REG_DWORD
    meta:
      domaincontroller: 1
      memberserver: 1
      server: 1
      CIS_ID:
        - 18.10.8.1
      NIST800-53R5:
        - MP-7
  {{ end }}
{{ end }}
