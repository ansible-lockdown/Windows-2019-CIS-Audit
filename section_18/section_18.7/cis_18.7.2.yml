---

{{ if .Vars.win19cis_level_1 }}
  {{ if .Vars.win19cis_rule_18_7_2 }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Printers\RedirectionguardPolicy:
    title: "18.7.2 | Ensure 'Configure Redirection Guard' is set to 'Enabled: Redirection Guard Enabled' | RedirectionguardPolicy"
    exists: true
    value: 1
    type: REG_DWORD
    meta:
      domaincontroller: 1
      memberserver: 1
      server: 1
      CIS_ID:
        - 18.7.2
      NIST800-53R5:
        - SI-16
  {{ end }}
{{ end }}
