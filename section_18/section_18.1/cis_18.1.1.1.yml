---

{{ if .Vars.win19cis_level_1 }}
  {{ if .Vars.win19cis_rule_18_1_1_1 }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\Windows\Personalization\NoLockScreenCamera:
    title: "18.1.1.1 | Ensure 'Prevent enabling lock screen camera' is set to 'Enabled' | NoLockScreenCamera"
    exists: true
    value: 1
    type: REG_DWORD
    meta:
      domaincontroller: 1
      memberserver: 1
      server: 1
      CIS_ID:
        - 18.1.1.1
      NIST800-53R5:
        - CM-6b
  {{ end }}
{{ end }}
