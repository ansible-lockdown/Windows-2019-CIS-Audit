---

{{ if .Vars.win19cis_level_2 }}
  {{ if .Vars.win19cis_rule_18_10_16_2 }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\Windows\DataCollection\DisableEnterpriseAuthProxy:
    title: "18.10.16.2 | Ensure 'Configure Authenticated Proxy usage for the Connected User Experience and Telemetry service' is set to 'Enabled: Disable Authenticated Proxy usage' | DisableEnterpriseAuthProxy"
    exists: true
    value: 1
    type: REG_DWORD
    meta:
      domaincontroller: 2
      memberserver: 2
      server: 2
      CIS_ID:
        - 18.10.16.2
      NIST800-53R5:
        - SI-4
  {{ end }}
{{ end }}
