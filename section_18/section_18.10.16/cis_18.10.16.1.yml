---

{{ if .Vars.win19cis_level_1 }}
  {{ if .Vars.win19cis_rule_18_10_16_1 }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\Windows\DataCollection\AllowTelemetry:
    title: "18.10.16.1 | Ensure 'Allow Diagnostic Data' is set to 'Enabled: Diagnostic data off (not recommended)' or 'Enabled: Send required diagnostic data' | AllowTelemetry"
    exists: true
    value: {{ .Vars.win19cis_allow_telemetry }}
    type: REG_DWORD
    meta:
      domaincontroller: 1
      memberserver: 1
      server: 1
      CIS_ID:
        - 18.10.16.1
      NIST800-53R5:
        - SI-4
  {{ end }}
{{ end }}
