---

{{ if .Vars.win19cis_level_1 }}
  {{ if .Vars.win19cis_rule_18_10_42_1 }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\MicrosoftAccount\DisableUserAuth:
    title: "18.10.42.1 | Ensure 'Block all consumer Microsoft account user authentication' is set to 'Enabled' | DisableUserAuth"
    exists: true
    value: 1
    type: REG_DWORD
    meta:
      domaincontroller: 1
      memberserver: 1
      server: 1
      CIS_ID:
        - 18.10.42.1
      NIST800-53R5:
        - AC-2(1)
  {{ end }}
{{ end }}
