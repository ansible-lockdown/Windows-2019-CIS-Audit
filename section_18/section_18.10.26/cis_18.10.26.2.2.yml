---

{{ if .Vars.win19cis_level_1 }}
  {{ if .Vars.win19cis_rule_18_10_26_2_2 }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\Windows\Eventlog\Security\MaxSize:
    title: "18.10.26.2.2 | Ensure 'Security: Specify the maximum log file size (KB)' is set to 'Enabled: 196,608 or greater' | MaxSize"
    exists: true
    value: {{ .Vars.win19cis_security_max_log_file_size }}
    type: REG_DWORD
    meta:
      domaincontroller: 1
      memberserver: 1
      server: 1
      CIS_ID:
        - 18.10.26.2.2
      NIST800-53R5:
        - AU-4
  {{ end }}
{{ end }}
