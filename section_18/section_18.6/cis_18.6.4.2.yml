---

{{ if .Vars.win19cis_level_1 }}
  {{ if .Vars.win19cis_rule_18_6_4_2 }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient\EnableNetbios:
    title: "18.6.4.2 | Ensure 'Configure NetBIOS settings' is set to 'Enabled: Disable NetBIOS name resolution on public networks' | EnableNetbios"
    exists: true
    value: {{ .Vars.win19cis_enable_netbios_policy }}
    type: REG_DWORD
    meta:
      domaincontroller: 1
      memberserver: 1
      server: 1
      CIS_ID:
        - 18.6.4.2
      NIST800-53R5:
        - CM-6
        - CM-7
  {{ end }}
{{ end }}
