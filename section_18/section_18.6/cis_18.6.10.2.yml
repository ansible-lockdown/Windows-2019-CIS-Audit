    title: "18.6.10.2 | Ensure 'Turn off Microsoft Peer-to-Peer Networking Services' is set to 'Enabled' | Disabled"
    exists: true
    value: 1
    type: REG_DWORD
    meta:
      domaincontroller: 2
      memberserver: 2
      server: 2
      CIS_ID:
        - 18.6.10.2
      NIST800-53R5:
        - CM-6
        - CM-7
  {{ end }}
{{ end }}
