---

{{ if .Vars.win19cis_level_1 }}
  {{ if .Vars.win19cis_rule_18_6_11_4 }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\Windows\Network Connections\NC_StdDomainUserSetLocation:
    title: "18.6.11.4 | Ensure 'Require domain users to elevate when setting a network's location' is set to 'Enabled' | NC_StdDomainUserSetLocation"
    exists: true
    value: 1
    type: REG_DWORD
    meta:
      domaincontroller: 1
      memberserver: 1
      server: 1
      CIS_ID:
        - 18.6.11.4
      NIST800-53R5:
        - AC-6(10)
  {{ end }}
{{ end }}
