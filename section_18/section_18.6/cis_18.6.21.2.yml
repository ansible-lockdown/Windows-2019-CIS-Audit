---

{{ if and (ne .Vars.win19cis_system_role "domaincontroller") .Vars.win19cis_level_2 }}
  {{ if .Vars.win19cis_rule_18_6_21_2 }}
    {{ if eq .Vars.win19cis_system_role "memberserver" }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\Windows\Wcmsvc\Grouppolicy\fBlockNonDomain:
    title: "18.6.21.2 | Ensure 'Prohibit connection to non-domain networks when connected to domain authenticated network' is set to 'Enabled' (MS only) | fBlockNonDomain"
    exists: true
    value: 1
    type: REG_DWORD
    meta:
      memberserver: 2
      server: 2
      CIS_ID:
        - 18.6.21.2
      NIST800-53R5:
        - SC-7
    {{ end }}
  {{ end }}
{{ end }}
