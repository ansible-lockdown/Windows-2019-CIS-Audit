    title: "18.10.77.2.1 | Ensure 'Configure Windows Defender SmartScreen' is set to 'Enabled: Warn and prevent bypass' | EnableSmartScreen"
    exists: true
    value: 1
    type: REG_DWORD
    meta:
      domaincontroller: 1
      memberserver: 1
      server: 1
      CIS_ID:
        - 18.10.77.2.1
      NIST800-53R5:
        - SI-16
  HKLM\SOFTWARE\Policies\Microsoft\Windows\System\ShellSmartScreenLevel:
    title: "18.10.77.2.1 | Ensure 'Configure Windows Defender SmartScreen' is set to 'Enabled: Warn and prevent bypass' | ShellSmartScreenLevel"
    exists: true
    value: "Block"
    type: REG_SZ
    meta:
      domaincontroller: 1
      memberserver: 1
      server: 1
      CIS_ID:
        - 18.10.77.2.1
      NIST800-53R5:
        - SI-16
  {{ end }}
{{ end }}
