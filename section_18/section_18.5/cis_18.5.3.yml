---

{{ if .Vars.win19cis_level_1 }}
  {{ if .Vars.win19cis_rule_18_5_3 }}
registry:
  HKLM\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters\DisableIPSourceRouting:
    title: "18.5.3 | Ensure 'MSS: (DisableIPSourceRouting) IP source routing protection level' is set to 'Enabled: Highest protection, source routing is completely disabled' | DisableIPSourceRouting"
    exists: true
    value: 2
    type: REG_DWORD
    meta:
      domaincontroller: 1
      memberserver: 1
      server: 1
      CIS_ID:
        - 18.5.3
      NIST800-53R5:
        - SC-7(12)
  {{ end }}
{{ end }}
