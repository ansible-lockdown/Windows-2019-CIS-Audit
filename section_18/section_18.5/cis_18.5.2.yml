---

{{ if .Vars.win19cis_level_1 }}
  {{ if .Vars.win19cis_rule_18_5_2 }}
registry:
  HKLM\SYSTEM\CurrentControlSet\Services\TCPIP6\Parameters\DisableIPSourceRouting:
    title: "18.5.2 | Ensure 'MSS: (DisableIPSourceRouting IPv6) IP source routing protection level' is set to 'Enabled: Highest protection, source routing is completely disabled' | DisableIPSourceRouting"
    exists: true
    value: 2
    type: REG_DWORD
    meta:
      domaincontroller: 1
      memberserver: 1
      server: 1
      CIS_ID:
        - 18.5.2
      NIST800-53R5:
        - CM-6
  {{ end }}
{{ end }}
