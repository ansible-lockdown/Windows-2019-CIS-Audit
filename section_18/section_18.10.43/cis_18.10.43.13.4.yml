---

{{ if .Vars.win19cis_level_1 }}
  {{ if .Vars.win19cis_rule_18_10_43_13_4 }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Scan\DaysUntilAggressiveCatchupQuickScan:
    title: "18.10.43.13.4 | Ensure 'Trigger a quick scan after X days without any scans' is set to 'Enabled: 7' | DaysUntilAggressiveCatchupQuickScan"
    exists: true
    value: 7
    type: REG_DWORD
    meta:
      domaincontroller: 1
      memberserver: 1
      server: 1
      CIS_ID:
        - 18.10.43.13.4
      NIST800-53R5:
        - SI-3
  {{ end }}
{{ end }}
