---

{{ if .Vars.win19cis_level_1 }}
  {{ if .Vars.win19cis_rule_18_10_43_16 }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\PUAProtection:
    title: "18.10.43.16 | Ensure 'Configure detection for potentially unwanted applications' is set to 'Enabled: Block' | PUAProtection"
    exists: true
    value: 1
    type: REG_DWORD
    meta:
      domaincontroller: 1
      memberserver: 1
      server: 1
      CIS_ID:
        - 18.10.43.16
      NIST800-53R5:
        - SI-3
  {{ end }}
{{ end }}
