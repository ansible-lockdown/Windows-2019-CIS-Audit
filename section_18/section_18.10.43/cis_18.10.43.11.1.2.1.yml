---

{{ if .Vars.win19cis_level_2 }}
  {{ if .Vars.win19cis_rule_18_10_43_11_1_2_1 }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Remediation\Behavioral Network Blocks\Remote Encryption Protection\RemoteEncryptionProtectionAggressiveness:
    title: "18.10.43.11.1.2.1 | Ensure 'Configure how aggressively Remote Encryption Protection blocks threats' is set to 'Enabled: Medium' or higher | RemoteEncryptionProtectionAggressiveness"
    exists: true
    value: {{ .Vars.win19cis_remote_encryption_protection_aggressiveness }}
    type: REG_DWORD
    meta:
      domaincontroller: 2
      memberserver: 2
      server: 2
      CIS_ID:
        - 18.10.43.11.1.2.1
      NIST800-53R5:
        - AC-7
        - SI-4
  {{ end }}
{{ end }}
