    exists: true
    value: {{ .Vars.win19cis_brute_force_protection_aggressiveness }}
    type: REG_DWORD
    meta:
      domaincontroller: 2
      memberserver: 2
      server: 2
      CIS_ID:
        - 18.10.43.11.1.1.1
      NIST800-53R5:
        - AC-7
        - SI-4
  {{ end }}
{{ end }}
