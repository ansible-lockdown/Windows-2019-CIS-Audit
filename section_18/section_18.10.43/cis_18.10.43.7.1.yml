---

{{ if .Vars.win19cis_level_1 }}
  {{ if .Vars.win19cis_rule_18_10_43_7_1 }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\MpEngine\EnableFileHashComputation:
    title: "18.10.43.7.1 | Ensure 'Enable file hash computation feature' is set to 'Enabled' | EnableFileHashComputation"
    exists: true
    value: 1
    type: REG_DWORD
    meta:
      domaincontroller: 1
      memberserver: 1
      server: 1
      CIS_ID:
        - 18.10.43.7.1
      NIST800-53R5:
        - SI-3
  {{ end }}
{{ end }}
