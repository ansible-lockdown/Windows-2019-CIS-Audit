---

{{ if .Vars.win19cis_level_1 }}
  {{ if .Vars.win19cis_rule_18_10_43_13_1 }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Scan\QuickScanIncludeExclusions:
    title: "18.10.43.13.1 | Ensure 'Scan excluded files and directories during quick scans' is set to 'Enabled: 1' | QuickScanIncludeExclusions"
    exists: true
    value: 1
    type: REG_DWORD
    meta:
      domaincontroller: 1
      memberserver: 1
      server: 1
      CIS_ID:
        - 18.10.43.13.1
      NIST800-53R5:
        - SI-3
  {{ end }}
{{ end }}
