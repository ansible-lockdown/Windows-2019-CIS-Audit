---

{{ if .Vars.win19cis_level_2 }}
  {{ if .Vars.win19cis_rule_18_10_43_8_1 }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\NIS\EnableConvertWarnToBlock:
    title: "18.10.43.8.1 | Ensure 'Convert warn verdict to block' is set to 'Enabled' | EnableConvertWarnToBlock"
    exists: true
    value: 1
    type: REG_DWORD
    meta:
      domaincontroller: 2
      memberserver: 2
      server: 2
      CIS_ID:
        - 18.10.43.8.1
      NIST800-53R5:
        - SI-3
        - SI-4
  {{ end }}
{{ end }}
