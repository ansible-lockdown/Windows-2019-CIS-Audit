---

{{ if .Vars.win19cis_level_1 }}
  {{ if .Vars.win19cis_rule_18_10_43_11_1_1_2 }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Remediation\Behavioral Network Blocks\Brute Force Protection\BruteForceProtectionConfiguredState:
    title: "18.10.43.11.1.1.2 | Ensure 'Configure Remote Encryption Protection Mode' is set to 'Enabled: Audit' or higher | BruteForceProtectionConfiguredState"
    exists: true
    value: {{ .Vars.win19cis_remote_encryption_protection_mode }}
    type: REG_DWORD
    meta:
      domaincontroller: 1
      memberserver: 1
      server: 1
      CIS_ID:
        - 18.10.43.11.1.1.2
      NIST800-53R5:
        - AC-7
        - SI-4
  {{ end }}
{{ end }}
