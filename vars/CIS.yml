---

## metadata for Audit benchmark
benchmark_version: 'v4.0.0'

#  timeout for each command to run where set
#  Windows pays PowerShell start-up plus Defender scanning an unsigned binary,
#  so a tight budget buys flakes rather than speed.
timeout_ms: 30000

#  Written by run_audit.ps1 before the audit runs. One collection pass replaces
#  a secedit/auditpol shell-out per control.
win19cis_policy_snapshot: 'C:\Windows\Temp\win19cis_policy_snapshot.txt'
#  One small file per collected value. goss prints the whole file when a
#  contents: matcher fails, so a shared snapshot would bury every failure.
win19cis_snapshot_dir: 'C:\Windows\Temp\win19cis_snapshot'

win19cis_section01: true
win19cis_section02: true
win19cis_section05: true
win19cis_section09: true
win19cis_section17: true
win19cis_section18: true
win19cis_section19: true

win19cis_level_1: true
win19cis_level_2: true
win19cis_ngws: false

#  Mirrors the remediation role's own gates, so the audit tests what the role
#  was actually asked to apply.
win19cis_system_role: 'memberserver'
win19cis_win_skip_for_test: false


