---

{{ if .Vars.win19cis_level_1 }}
  {{ if .Vars.win19cis_rule_9_1_3 }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\WindowsFirewall\DomainProfile\DisableNotifications:
    title: "9.1.3 | Ensure 'Windows Firewall: Domain: Settings: Display a notification' is set to 'No' | DisableNotifications"
    exists: true
    value: 1
    type: REG_DWORD
    meta:
      domaincontroller: 1
      memberserver: 1
      server: 1
      CIS_ID:
        - 9.1.3
      NIST800-53R5:
        - SC-7
        - SC-7(5)
  {{ end }}
{{ end }}
