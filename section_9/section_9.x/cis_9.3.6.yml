---

{{ if .Vars.win19cis_level_1 }}
  {{ if .Vars.win19cis_rule_9_3_6 }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\WindowsFirewall\PublicProfile\Logging\LogFilePath:
    title: "9.3.6 | Ensure 'Windows Firewall: Public: Logging: Name' is configured | LogFilePath"
    exists: true
    value: '{{ .Vars.win19cis_public_firewall_log_path }}'
    type: REG_SZ
    meta:
      domaincontroller: 1
      memberserver: 1
      server: 1
      CIS_ID:
        - 9.3.6
      NIST800-53R5:
        - SC-7
        - SC-7(5)
  {{ end }}
{{ end }}
