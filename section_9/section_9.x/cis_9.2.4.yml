---

{{ if .Vars.win19cis_level_1 }}
  {{ if .Vars.win19cis_rule_9_2_4 }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\WindowsFirewall\PrivateProfile\Logging\LogFilePath:
    title: "9.2.4 | Ensure 'Windows Firewall: Private: Logging: Name' is set to '%SystemRoot%\\System32\\logfiles\\firewall\\privatefw.log' | LogFilePath"
    exists: true
    value: '{{ .Vars.win19cis_private_firewall_log_path }}'
    type: REG_SZ
    meta:
      domaincontroller: 1
      memberserver: 1
      server: 1
      CIS_ID:
        - 9.2.4
      NIST800-53R5:
        - SC-7
        - SC-7(5)
  {{ end }}
{{ end }}
