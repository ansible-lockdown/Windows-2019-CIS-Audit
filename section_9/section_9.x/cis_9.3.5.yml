---

{{ if .Vars.win19cis_level_1 }}
  {{ if .Vars.win19cis_rule_9_3_5 }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\WindowsFirewall\PublicProfile\AllowLocalIPsecPolicyMerge:
    title: "9.3.5 | Ensure 'Windows Firewall: Public: Settings: Apply local connection security rules' is set to 'No' | AllowLocalIPsecPolicyMerge"
    exists: true
    value: 0
    type: REG_DWORD
    meta:
      domaincontroller: 1
      memberserver: 1
      server: 1
      CIS_ID:
        - 9.3.5
      NIST800-53R5:
        - SC-7
        - SC-7(5)
  {{ end }}
{{ end }}
