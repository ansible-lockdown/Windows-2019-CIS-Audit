---

{{ if .Vars.win19cis_level_1 }}
  {{ if .Vars.win19cis_rule_9_3_7 }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\WindowsFirewall\PublicProfile\Logging\LogFileSize:
    title: "9.3.7 | Ensure 'Windows Firewall: Public: Logging: Size limit (KB)' is set to '16,384 KB or greater' | LogFileSize"
    exists: true
    value: {{ .Vars.win19cis_public_firewall_log_size }}
    type: REG_DWORD
    meta:
      domaincontroller: 1
      memberserver: 1
      server: 1
      CIS_ID:
        - 9.3.7
      NIST800-53R5:
        - SC-7
        - SC-7(5)
  {{ end }}
{{ end }}
