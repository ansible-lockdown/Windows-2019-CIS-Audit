---

{{ if .Vars.win19cis_level_1 }}
  {{ if .Vars.win19cis_rule_1_1_5 }}
file:
  win19cis_1_1_5_passwordcomplexity:
    title: "1.1.5 | Ensure 'Password must meet complexity requirements' is set to 'Enabled' | PasswordComplexity"
    path: '{{ .Vars.win19cis_snapshot_dir }}\SystemAccess.PasswordComplexity'
    exists: true
    contents:
      - '/^1$/'
    skip: {{ if eq .Vars.win19cis_system_role "standalone" }}false{{ else }}true{{ end }}
    meta:
      skip_reason: "domain scoped - on a domain joined host the Default Domain Policy sets this [System Access] value, so the role does not apply it"
      domaincontroller: 1
      memberserver: 1
      server: 1
      CIS_ID:
        - 1.1.5
      NIST800-53R5:
        - IA-5(1)
  {{ end }}
{{ end }}
