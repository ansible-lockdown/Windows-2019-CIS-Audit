---

{{ if .Vars.win19cis_level_1 }}
  {{ if .Vars.win19cis_rule_2_3_1_2 }}
registry:
  HKLM\SYSTEM\CurrentControlSet\Control\Lsa\LimitBlankPasswordUse:
    title: "2.3.1.2 | Ensure 'Accounts: Limit local account use of blank passwords to console logon only' is set to 'Enabled' | LimitBlankPasswordUse"
    exists: true
    value: 1
    type: REG_DWORD
    meta:
      domaincontroller: 1
      memberserver: 1
      server: 1
      CIS_ID:
        - 2.3.1.2
      NIST800-53R5:
        - IA-5(1)
  {{ end }}
{{ end }}
