---

{{ if and (ne .Vars.win19cis_system_role "domaincontroller") .Vars.win19cis_level_1 }}
  {{ if .Vars.win19cis_rule_2_3_1_1 }}
    {{ if ne .Vars.win19cis_system_role "domaincontroller" }}
file:
  win19cis_2_3_1_1_enableguestaccount:
    title: "2.3.1.1 | Ensure 'Accounts: Guest account status' is set to 'Disabled' (MS only) | EnableGuestAccount"
    path: '{{ .Vars.win19cis_snapshot_dir }}\SystemAccess.EnableGuestAccount'
    exists: true
    contents:
      - '/^0$/'
    meta:
      memberserver: 1
      server: 1
      CIS_ID:
        - 2.3.1.1
      NIST800-53R5:
        - IA-5
    {{ end }}
  {{ end }}
{{ end }}
