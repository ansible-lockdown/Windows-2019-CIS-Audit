    title: "2.3.11.3 | Ensure 'Network Security: Allow PKU2U authentication requests to this computer to use online identities' is set to 'Disabled' | AllowOnlineID"
    exists: true
    value: 0
    type: REG_DWORD
    meta:
      domaincontroller: 1
      memberserver: 1
      server: 1
      CIS_ID:
        - 2.3.11.3
      NIST800-53R5:
        - CM-1
        - CM-2
        - AC-2
        - CM-6
        - CM-7
        - CM-7(1)
        - CM-9
        - SA-3
        - SA-8
        - SA-10
  {{ end }}
{{ end }}
