---

{{ if and (eq .Vars.win19cis_system_role "domaincontroller") .Vars.win19cis_level_1 }}
  {{ if .Vars.win19cis_rule_2_3_11_12 }}
    {{ if eq .Vars.win19cis_system_role "domaincontroller" }}
registry:
  HKLM\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters\AuditNTLMInDomain:
    title: "2.3.11.12 | Ensure 'Network security: Restrict NTLM: Audit NTLM authentication in this domain' is set to 'Enable all' (DC only) | AuditNTLMInDomain"
    exists: true
    value: 7
    type: REG_DWORD
    meta:
      domaincontroller: 1
      server: 1
      CIS_ID:
        - 2.3.11.12
      NIST800-53R5:
        - AU-3
        - AU-3(1)
        - AU-7
        - AU-12
    {{ end }}
  {{ end }}
{{ end }}
