---

{{ if .Vars.win19cis_level_1 }}
  {{ if .Vars.win19cis_rule_2_3_8_2 }}
registry:
  HKLM\SYSTEM\CurrentControlSet\Services\LanmanWorkstation\Parameters\EnablePlainTextPassword:
    title: "2.3.8.2 | Ensure 'Microsoft network client: Send unencrypted password to third-party SMB servers' is set to 'Disabled' | EnablePlainTextPassword"
    exists: true
    value: 0
    type: REG_DWORD
    meta:
      domaincontroller: 1
      memberserver: 1
      server: 1
      CIS_ID:
        - 2.3.8.2
      NIST800-53R5:
        - AC-17(2)
        - IA-5
        - IA-5(1)
        - SC-8
        - SC-8(1)
  {{ end }}
{{ end }}
