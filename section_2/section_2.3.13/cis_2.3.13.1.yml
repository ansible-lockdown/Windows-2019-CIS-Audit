---

{{ if .Vars.win19cis_level_1 }}
  {{ if .Vars.win19cis_rule_2_3_13_1 }}
registry:
  HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\ShutdownWithoutLogon:
    title: "2.3.13.1 | Ensure 'Shutdown: Allow system to be shut down without having to log on' is set to 'Disabled' | ShutdownWithoutLogon"
    exists: true
    value: 0
    type: REG_DWORD
    meta:
      domaincontroller: 1
      memberserver: 1
      server: 1
      CIS_ID:
        - 2.3.13.1
      NIST800-53R5:
        - AC-6(10)
  {{ end }}
{{ end }}
