---

{{ if .Vars.win19cis_level_1 }}
  {{ if .Vars.win19cis_rule_2_3_7_4 }}
registry:
  HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\LegalNoticeText:
    title: "2.3.7.4 | Configure 'Interactive logon: Message text for users attempting to log on' | LegalNoticeText"
    exists: true
    value:
      match-regexp: '{{ .Vars.win19cis_legal_notice_match }}'
    type: REG_SZ
    meta:
      domaincontroller: 1
      memberserver: 1
      server: 1
      CIS_ID:
        - 2.3.7.4
      NIST800-53R5:
        - AC-8
  {{ end }}
{{ end }}
