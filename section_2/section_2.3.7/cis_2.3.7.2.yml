---

{{ if .Vars.win19cis_level_1 }}
  {{ if .Vars.win19cis_rule_2_3_7_2 }}
registry:
  HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\DontDisplayLastUserName:
    title: "2.3.7.2 | Ensure 'Interactive logon: Don't display last signed-in' is set to 'Enabled' | DontDisplayLastUserName"
    exists: true
    value: 1
    type: REG_DWORD
    meta:
      domaincontroller: 1
      memberserver: 1
      server: 1
      CIS_ID:
        - 2.3.7.2
      NIST800-53R5:
        - AC-7
        - AC-19
  {{ end }}
{{ end }}
