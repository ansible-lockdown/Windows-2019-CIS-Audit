---

{{ if .Vars.win19cis_level_1 }}
  {{ if .Vars.win19cis_rule_2_3_15_2 }}
registry:
  HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\ProtectionMode:
    title: "2.3.15.2 | Ensure 'System objects: Strengthen default permissions of internal system objects (e.g. Symbolic Links)' is set to 'Enabled' | ProtectionMode"
    exists: true
    value: 1
    type: REG_DWORD
    meta:
      domaincontroller: 1
      memberserver: 1
      server: 1
      CIS_ID:
        - 2.3.15.2
      NIST800-53R5:
        - CM-1
        - CM-2
        - AC-2
        - CM-6
        - CM-7
        - CM-7(1)
        - CM-9
        - SA-3
        - SA-8
        - SA-10
  {{ end }}
{{ end }}
