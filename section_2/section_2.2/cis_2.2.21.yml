---

{{ if and (ne .Vars.win19cis_system_role "domaincontroller") .Vars.win19cis_level_1 }}
  {{ if .Vars.win19cis_rule_2_2_21 }}
    {{ if not .Vars.win19cis_win_skip_for_test }}
      {{ if eq .Vars.win19cis_system_role "memberserver" }}
file:
  win19cis_2_2_21_sedenynetworklogonright:
    title: "2.2.21 | Ensure 'Deny access to this computer from the network' to include 'Guests, Local account and member of Administrators group' (MS only) | SeDenyNetworkLogonRight"
    path: '{{ .Vars.win19cis_snapshot_dir }}\PrivilegeRights.SeDenyNetworkLogonRight'
    exists: true
    contents:
      - '/^(.*,)?S-1-5-114(,.*)?$/'
      - '/^(.*,)?S-1-5-32-546(,.*)?$/'
    meta:
      memberserver: 1
      server: 1
      CIS_ID:
        - 2.2.21
      NIST800-53R5:
        - AC-2
        - AC-3
        - AC-6
        - AC-6(1)
        - AC-6(7)
        - AU-9(4)
      {{ end }}
    {{ end }}
  {{ end }}
{{ end }}
