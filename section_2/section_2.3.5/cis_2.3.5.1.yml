---

{{ if and (eq .Vars.win19cis_system_role "domaincontroller") .Vars.win19cis_level_1 }}
  {{ if .Vars.win19cis_rule_2_3_5_1 }}
    {{ if eq .Vars.win19cis_system_role "domaincontroller" }}
registry:
  HKLM\SYSTEM\CurrentControlSet\Control\Lsa\SubmitControl:
    title: "2.3.5.1 | Ensure 'Domain controller: Allow server operators to schedule tasks' is set to 'Disabled' (DC only) | SubmitControl"
    exists: true
    value: 0
    type: REG_DWORD
    meta:
      domaincontroller: 1
      server: 1
      CIS_ID:
        - 2.3.5.1
      NIST800-53R5:
        - AC-6(8)
    {{ end }}
  {{ end }}
{{ end }}
