---

{{ if .Vars.win19cis_level_1 }}
  {{ if .Vars.win19cis_rule_2_3_10_8 }}
registry:
  HKLM\SYSTEM\CurrentControlSet\Control\SecurePipeServers\Winreg\AllowedExactPaths\Machine:
    title: "2.3.10.8 | Ensure 'Network access: Remotely accessible registry paths' is configured | Machine"
    exists: true
    value: "System\\CurrentControlSet\\Control\\ProductOptions\nSystem\\CurrentControlSet\\Control\\Server Applications\nSoftware\\Microsoft\\Windows NT\\CurrentVersion"
    type: REG_MULTI_SZ
    meta:
      domaincontroller: 1
      memberserver: 1
      server: 1
      CIS_ID:
        - 2.3.10.8
      NIST800-53R5:
        - AC-6(7)(b)
  {{ end }}
{{ end }}
