---

{{ if and (ne .Vars.win19cis_system_role "domaincontroller") .Vars.win19cis_level_1 }}
  {{ if .Vars.win19cis_rule_2_3_9_4 }}
    {{ if ne .Vars.win19cis_system_role "standalone" }}
      {{ if eq .Vars.win19cis_system_role "memberserver" }}
registry:
  HKLM\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters\SMBServerNameHardeningLevel:
    title: "2.3.9.4 | Ensure 'Microsoft network server: Server SPN target name validation level' is set to 'Accept if provided by client' or higher (MS only) | SMBServerNameHardeningLevel"
    exists: true
    value: {{ .Vars.win19cis_smb_server_name_hardening_level }}
    type: REG_DWORD
    meta:
      memberserver: 1
      server: 1
      CIS_ID:
        - 2.3.9.4
      NIST800-53R5:
        - CM-1
        - CM-2
        - AC-2
        - CM-6
        - CM-7
        - CM-7(1)
        - CM-9
        - SA-3
        - SA-8
        - SA-10
      {{ end }}
    {{ end }}
  {{ end }}
{{ end }}
