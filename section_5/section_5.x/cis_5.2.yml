---

{{ if and (ne .Vars.win19cis_system_role "domaincontroller") .Vars.win19cis_level_2 }}
  {{ if .Vars.win19cis_rule_5_2 }}
    {{ if ne .Vars.win19cis_system_role "domaincontroller" }}
file:
  win19cis_5_2_spooler:
    title: "5.2 | Ensure 'Print Spooler (Spooler)' is set to 'Disabled' (MS only) | Spooler"
    path: '{{ .Vars.win19cis_snapshot_dir }}\Service.Spooler'
    exists: true
    contents:
      - '/^(Disabled|NotInstalled)$/'
    meta:
      memberserver: 2
      server: 2
      CIS_ID:
        - 5.2
      NIST800-53R5:
        - CM-6
        - CM-7
    {{ end }}
  {{ end }}
{{ end }}
